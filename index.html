<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <!-- 흰 큰 카드 -->
    <section class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <p class="section-label">ABOUT ME</p>

        <div class="photo" id="photo">
          <span class="photo-empty">사진 없음</span>
        </div>

        <h2 class="about-name" id="name">불러오는 중…</h2>
        <p class="about-title" id="title"></p>
        <p class="badge" id="badge" hidden></p>

        <ul class="contact">
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-key">이름</span>
              <span class="contact-value" id="c-name"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-key">이메일</span>
              <span class="contact-value" id="c-email"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-key">연락처</span>
              <span class="contact-value" id="c-phone"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon">
              <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-key">위치</span>
              <span class="contact-value" id="c-location"></span>
            </span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <div class="content">
        <h1 class="big-title">PORTFOLIO</h1>

        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
              </span>
              EDUCATION
            </h3>
            <p class="fact-text" id="education"></p>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
              </span>
              SKILLS &amp; TOOLS
            </h3>
            <p class="fact-text" id="skills"></p>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>
              </span>
              EXPERIENCE
            </h3>
            <p class="fact-text" id="experience"></p>
          </div>
        </div>

        <div class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards">
            <p class="muted">불러오는 중…</p>
          </div>
        </div>

        <blockquote class="quote" id="quote" hidden></blockquote>
      </div>
    </section>

    <!-- 메일 보내기 (Web3Forms) -->
    <section class="sheet guestbook">
      <h2 class="big-title small">CONTACT</h2>
      <p class="intro mail-guide">궁금한 점이나 제안을 남겨 주시면 메일로 받아 보고 답장드릴게요.</p>

      <form class="mail-form" id="mail-form">
        <div class="mail-row">
          <input class="gb-input" id="mail-name" type="text" placeholder="이름" maxlength="50" autocomplete="name" required>
          <input class="gb-input" id="mail-email" type="email" placeholder="답장 받을 이메일" maxlength="100" autocomplete="email" required>
        </div>
        <textarea class="gb-input mail-message" id="mail-message" placeholder="보낼 내용" maxlength="2000" required></textarea>
        <!-- 스팸 로봇만 채우는 칸 (사람에게는 안 보임) -->
        <input type="checkbox" id="mail-botcheck" class="mail-botcheck" tabindex="-1" autocomplete="off">
        <button class="gb-button mail-button" id="mail-button" type="button">메일 보내기</button>
      </form>
      <p class="gb-status" id="mail-status"></p>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title small">GUESTBOOK</h2>

      <form class="gb-form" id="gb-form">
        <input class="gb-input gb-nick" id="gb-nick" type="text" placeholder="별명" maxlength="20" required>
        <input class="gb-input gb-msg" id="gb-msg" type="text" placeholder="한마디를 남겨 주세요" maxlength="200" required>
        <button class="gb-button" id="gb-button" type="button">남기기</button>
      </form>
      <p class="gb-status" id="gb-status"></p>

      <ul class="gb-list" id="gb-list">
        <li class="muted">불러오는 중…</li>
      </ul>
    </section>

    <p class="admin-link"><a href="admin.html">관리자</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
